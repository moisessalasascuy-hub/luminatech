<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LuminaTech | Base de datos</title>
    <style>
        :root { --bg: #0b1120; --panel: #172033; --line: rgba(255,255,255,.12); --text: #f8fafc; --muted: #94a3b8; --accent: #38bdf8; }
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 Arial, sans-serif; }
        main { width: min(1400px, 94%); margin: 0 auto; padding: 36px 0 60px; }
        header { display: flex; justify-content: space-between; align-items: center; gap: 20px; margin-bottom: 28px; }
        h1, h2 { margin: 0; } h1 { font-size: clamp(1.7rem, 4vw, 2.5rem); } h2 { font-size: 1.2rem; margin-bottom: 14px; }
        p { color: var(--muted); } .button { border: 1px solid var(--accent); background: transparent; color: var(--accent); padding: 10px 15px; border-radius: 5px; cursor: pointer; }
        .button:hover { background: var(--accent); color: var(--bg); }
        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 24px; }
        .stat, section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 20px; }
        .stat strong { display: block; color: var(--accent); font-size: 2rem; } .stat span { color: var(--muted); }
        .visuals { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 24px; }
        .chart { display: flex; flex-direction: column; gap: 12px; }
        .chart-row { display: grid; grid-template-columns: minmax(90px, 140px) 1fr 56px; gap: 10px; align-items: center; }
        .chart-label, .chart-value { color: var(--muted); font-size: .85rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .chart-value { text-align: right; color: var(--text); }
        .bar-track { height: 12px; background: rgba(255,255,255,.08); border-radius: 20px; overflow: hidden; }
        .bar { height: 100%; min-width: 3px; background: linear-gradient(90deg, var(--accent), #22c55e); border-radius: inherit; }
        section { margin-bottom: 24px; overflow: hidden; } .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 620px; } th, td { text-align: left; vertical-align: top; padding: 12px 10px; border-bottom: 1px solid var(--line); } th { color: var(--accent); font-size: .82rem; text-transform: uppercase; } td { color: #dbeafe; }
        .empty { color: var(--muted); } .error { color: #fca5a5; }
        @media (max-width: 700px) { header { align-items: flex-start; flex-direction: column; } .stats, .visuals { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <main>
        <header><div><h1>Base de datos LuminaTech</h1><p>Contactos, pedidos y actividad registrada.</p></div><button class="button" onclick="loadData()">Actualizar datos</button></header>
        <div id="stats" class="stats"></div>
        <div class="visuals">
            <section><h2>Importes de pedidos (demo)</h2><div id="revenue-chart" class="chart"></div></section>
            <section><h2>Actividad registrada</h2><div id="events-chart" class="chart"></div></section>
        </div>
        <section><h2>Contactos</h2><div id="contacts" class="table-wrap"></div></section>
        <section><h2>Pedidos</h2><div id="orders" class="table-wrap"></div></section>
        <section><h2>Últimos eventos</h2><div id="events" class="table-wrap"></div></section>
    </main>
    <script>
        const escapeHtml = value => String(value ?? '').replace(/[&<>'"]/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[char]));
        const money = value => `${Number(value).toFixed(2).replace('.', ',')} €`;
        const fetchAdminData = async () => {
            let password = sessionStorage.getItem('adminPassword') || '';
            const request = () => fetch('/api/admin/data', {
                headers: password ? { Authorization: `Basic ${btoa(`admin:${password}`)}` } : {}
            });
            let response = await request();
            if (response.status === 401) {
                password = window.prompt('Contraseña del panel de administración') || '';
                if (!password) return response;
                sessionStorage.setItem('adminPassword', password);
                response = await request();
                if (response.status === 401) sessionStorage.removeItem('adminPassword');
            }
            return response;
        };
        const renderTable = (target, headers, rows, empty = 'No hay registros todavía.') => {
            document.getElementById(target).innerHTML = rows.length ? `<table><thead><tr>${headers.map(header => `<th>${header}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table>` : `<p class="empty">${empty}</p>`;
        };
        const renderChart = (target, rows) => {
            const chart = document.getElementById(target);
            if (!rows.length) { chart.innerHTML = '<p class="empty">No hay datos para mostrar.</p>'; return; }
            const maximum = Math.max(...rows.map(row => row.value), 1);
            chart.innerHTML = rows.map(row => `<div class="chart-row"><span class="chart-label" title="${escapeHtml(row.label)}">${escapeHtml(row.label)}</span><div class="bar-track"><div class="bar" style="width:${(row.value / maximum) * 100}%"></div></div><span class="chart-value">${escapeHtml(row.display ?? row.value)}</span></div>`).join('');
        };
        async function loadData() {
            try {
                const response = await fetchAdminData();
                if (!response.ok) throw new Error('No se pudo consultar la base de datos');
                const data = await response.json();
                document.getElementById('stats').innerHTML = `<div class="stat"><strong>${data.contacts.length}</strong><span>Contactos</span></div><div class="stat"><strong>${data.orders.length}</strong><span>Pedidos</span></div><div class="stat"><strong>${data.events.length}</strong><span>Eventos registrados</span></div>`;
                renderChart('revenue-chart', data.orders.slice(0, 8).reverse().map(order => ({ label: `Pedido #${order.id}`, value: Number(order.total), display: money(order.total) })));
                const eventCounts = data.events.reduce((counts, event) => { counts[event.type] = (counts[event.type] || 0) + 1; return counts; }, {});
                renderChart('events-chart', Object.entries(eventCounts).sort((a, b) => b[1] - a[1]).map(([label, value]) => ({ label, value })));
                renderTable('contacts', ['ID', 'Empresa', 'Correo', 'Mensaje', 'Fecha'], data.contacts.map(item => `<tr><td>#${item.id}</td><td>${escapeHtml(item.company)}</td><td>${escapeHtml(item.email)}</td><td>${escapeHtml(item.message)}</td><td>${escapeHtml(item.created_at)}</td></tr>`));
                renderTable('orders', ['ID', 'Compra', 'Total', 'Iniciales del comprador', 'Estado del pago', 'Fecha'], data.orders.map(item => `<tr><td>#${item.id}</td><td>${item.items.map(product => `${escapeHtml(product.name)} (${money(product.price)})`).join('<br>')}</td><td>${money(item.total)}</td><td>${escapeHtml(item.buyer_initials || '---')}</td><td>${escapeHtml(item.status === 'paid_demo' ? 'Pago realizado (demo)' : item.status)}</td><td>${escapeHtml(item.created_at)}</td></tr>`));
                renderTable('events', ['ID', 'Tipo', 'Detalles', 'Fecha'], data.events.map(item => `<tr><td>#${item.id}</td><td>${escapeHtml(item.type)}</td><td>${escapeHtml(JSON.stringify(item.details))}</td><td>${escapeHtml(item.created_at)}</td></tr>`));
            } catch (error) {
                document.getElementById('stats').innerHTML = `<p class="error">${escapeHtml(error.message)}. Comprueba que el servidor esté iniciado.</p>`;
            }
        }
        loadData();
    </script>
</body>
</html>
